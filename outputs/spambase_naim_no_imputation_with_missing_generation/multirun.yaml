hydra:
  run:
    dir: ${output_path}/${hydra.job.name}
  sweep:
    dir: ${output_path}/${hydra.job.name}
    subdir: ''
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - experiment=classification_with_missing_generation
    - experiment/databases@db=spambase
  job:
    name: ${experiment_name}
    chdir: false
    override_dirname: experiment/databases@db=spambase,experiment=classification_with_missing_generation
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.0
    version_base: '1.3'
    cwd: /work/dlclarge1/matusd-naim/NAIM-seminar
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /work/dlclarge1/matusd-naim/NAIM-seminar/confs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      experiment: classification_with_missing_generation
      experiment/metric@performance_metrics.f1_score: f1_score
      experiment/metric@performance_metrics.precision: precision
      experiment/metric@performance_metrics.recall: recall
      experiment/metric@performance_metrics.accuracy: accuracy
      experiment/metric@performance_metrics.auc: auc
      experiment/metric@train.set_metrics.auc: auc
      experiment/train_utils@train.manager: train_manager
      experiment/optimizer@train.optimizer: adam
      experiment/regularizer@train.regularizer.l2: l2
      experiment/regularizer@train.regularizer.l1: l1
      experiment/loss@train.loss.CE: cross_entropy
      experiment/initializer@train.initializer: xavier_normal
      experiment/model_type_params@train.dl_params: dl_params
      experiment/model@model: naim
      experiment/model_type_params@ml_params: ml_params
      experiment/model_type_params@dl_params: dl_params
      experiment/preprocessing/imputer@preprocessing.imputer: no_imputation
      experiment/preprocessing/categorical@preprocessing.categorical: categorical_encode
      experiment/preprocessing/numerical@preprocessing.numerical: normalize
      experiment/preprocessing/missing_generation@missing_generation.test: MCAR_global
      experiment/preprocessing/missing_generation@missing_generation.val: no_generation
      experiment/preprocessing/missing_generation@missing_generation.train: MCAR_global
      experiment/cross_validation@val_cv: holdout
      experiment/cross_validation@test_cv: stratifiedkfold
      experiment/databases@db: spambase
      experiment/paths@paths: experiment_paths
      experiment/paths@_global_: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
data_path: ./datasets
output_path: ./outputs
experiment_name: ${db.name}_${model.name}_${preprocessing.imputer.method}_with_missing_generation
pipeline: missing
seed: 42
verbose: 1
continue_experiment: true
missing_percentages:
- 0.0
- 0.05
- 0.1
- 0.25
- 0.5
- 0.75
paths:
  experiment: ${hydra:runtime.output_dir}
  cv: ${hydra:runtime.output_dir}/cross_validation
  preprocessing:
    numerical: ${hydra:runtime.output_dir}/preprocessing/numerical_preprocessing
    categorical: ${hydra:runtime.output_dir}/preprocessing/categorical_preprocessing
    imputer: ${hydra:runtime.output_dir}/preprocessing/imputer
  model: ${hydra:runtime.output_dir}/saved_models
  predictions: ${hydra:runtime.output_dir}/predictions
  results: ${hydra:runtime.output_dir}/results
db:
  _target_: CMC_utils.datasets.ClassificationDataset
  _convert_: all
  name: spambase
  db_type: tabular
  classes:
  - 0
  - 1
  label_type: multiclass
  task: classification
  path: ${data_path}/tabular/classification/spambase/spambase.data
  columns:
    word_freq_make: float
    word_freq_address: float
    word_freq_all: float
    word_freq_3d: float
    word_freq_our: float
    word_freq_over: float
    word_freq_remove: float
    word_freq_internet: float
    word_freq_order: float
    word_freq_mail: float
    word_freq_receive: float
    word_freq_will: float
    word_freq_people: float
    word_freq_report: float
    word_freq_addresses: float
    word_freq_free: float
    word_freq_business: float
    word_freq_email: float
    word_freq_you: float
    word_freq_credit: float
    word_freq_your: float
    word_freq_font: float
    word_freq_000: float
    word_freq_money: float
    word_freq_hp: float
    word_freq_hpl: float
    word_freq_george: float
    word_freq_650: float
    word_freq_lab: float
    word_freq_labs: float
    word_freq_telnet: float
    word_freq_857: float
    word_freq_data: float
    word_freq_415: float
    word_freq_85: float
    word_freq_technology: float
    word_freq_1999: float
    word_freq_parts: float
    word_freq_pm: float
    word_freq_direct: float
    word_freq_cs: float
    word_freq_meeting: float
    word_freq_original: float
    word_freq_project: float
    word_freq_re: float
    word_freq_edu: float
    word_freq_table: float
    word_freq_conference: float
    char_freq_;: float
    char_freq_(: float
    char_freq_[: float
    char_freq_!: float
    char_freq_$: float
    char_freq_#: float
    capital_run_length_average: float
    capital_run_length_longest: float
    capital_run_length_total: float
    Class: target
  pandas_load_kwargs:
    header: null
  dataset_class:
    _target_: CMC_utils.datasets.SupervisedTabularDatasetTorch
    _convert_: all
test_cv:
  method: stratifiedkfold
  n_splits: 5
  shuffle: true
  random_state: ${seed}
val_cv:
  method: holdout
  train_size: null
  test_size: 0.2
  stratify: true
  random_state: ${seed}
missing_generation:
  train:
    method: MCAR_global
    missing_fraction: 0.3
  val:
    method: no_generation
    missing_fraction: 0.0
  test:
    method: MCAR_global
    missing_fraction: 0.3
preprocessing:
  numerical:
    method: normalize
    axis: 0
    all_columns: false
  categorical:
    method: categorical_encode
    nan_as_category: false
    fill_value: null
  imputer:
    method: no_imputation
    features: all
    sparse: auto
    error_on_new: true
    concat_mask: false
dl_params:
  max_epochs: 1500
  min_epochs: 50
  batch_size: 32
  init_learning_rate: 0.001
  end_learning_rate: 1.0e-08
  learning_rates:
  - 0.001
  - 0.0001
  - 1.0e-05
  - 1.0e-06
  - 1.0e-07
  early_stopping_patience: 50
  scheduler_patience: 25
  performance_tolerance: 0.001
  verbose: ${verbose}
  verbose_batch: 0
  device: cuda
ml_params:
  n_estimators: 100
model:
  name: naim
  framework: torch
  model_type: tabular
  is_SOTA: false
  model_tasks:
  - classification
  label_types:
  - binary
  - categorical
  set_params_function:
    _target_: CMC_utils.models.set_naim_params
  init_params:
    _target_: CMC_utils.models.NAIM
    _convert_: all
    input_size: null
    output_size: null
    cat_idxs: null
    cat_dims: null
    d_token: 6
    embedder_initialization: normal
    bias: false
    mask_type: 2
    missing_value: ~inf
    num_heads: 3
    feedforward_dim: 1000
    dropout_rate: 0.0
    activation: relu
    num_layers: 6
    extractor: false
  fit_params: {}
  train_function:
    _target_: CMC_utils.models.train_torch_model
  test_function:
    _target_: CMC_utils.models.test_torch_model
  save_function:
    _target_: CMC_utils.save_load.save_model
  file_extension: pth
  load_function:
    _target_: CMC_utils.save_load.load_model
train:
  dl_params:
    max_epochs: 1500
    min_epochs: 50
    batch_size: 32
    init_learning_rate: 0.001
    end_learning_rate: 1.0e-08
    learning_rates:
    - 0.001
    - 0.0001
    - 1.0e-05
    - 1.0e-06
    - 1.0e-07
    early_stopping_patience: 50
    scheduler_patience: 25
    performance_tolerance: 0.001
    verbose: ${verbose}
    verbose_batch: 0
    device: cuda
  initializer:
    name: xavier_normal
    params:
      gain: 1.0
  loss:
    CE:
      name: cross_entropy
      init_params:
        _target_: torch.nn.CrossEntropyLoss
      set_params_function:
        _target_: CMC_utils.miscellaneous.do_nothing
      alpha: 1
  regularizer:
    l1:
      name: l1
      init_params:
        _target_: CMC_utils.regularizers.L1RegularizationLoss
      alpha: 0.0001
    l2:
      name: l2
      init_params:
        _target_: CMC_utils.regularizers.L2RegularizationLoss
      alpha: 0.0001
  optimizer:
    name: adam
    init:
      _target_: torch.optim.Adam
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
      weight_decay: 0
      amsgrad: false
      foreach: null
      maximize: false
      capturable: false
  manager:
    _target_: CMC_utils.models.TrainManager
    min_epochs: ${dl_params.min_epochs}
    max_epochs: ${dl_params.max_epochs}
    performance_tolerance: ${dl_params.performance_tolerance}
    device: ${dl_params.device}
    verbose: ${verbose}
    verbose_batch: ${dl_params.verbose_batch}
    early_stop:
      _target_: CMC_utils.models.EarlyStopper
      patience: ${dl_params.early_stopping_patience}
      min_epochs: ${dl_params.min_epochs}
    model_checkpoint:
      _target_: CMC_utils.models.ModelCheckpointer
    scheduler:
      _target_: CMC_utils.models.CustomScheduler
      learning_rates: ${dl_params.learning_rates}
      patience: ${dl_params.scheduler_patience}
      verbose: ${verbose}
      min_epochs: ${dl_params.min_epochs}
  set_metrics:
    auc:
      name: auc
      init:
        _target_: CMC_utils.metrics.AUC
        average: null
        sample_weight: null
        max_fpr: null
        multi_class: ovr
      set_params_function:
        _target_: CMC_utils.miscellaneous.do_nothing
performance_metrics:
  auc:
    name: auc
    init:
      _target_: CMC_utils.metrics.AUC
      average: null
      sample_weight: null
      max_fpr: null
      multi_class: ovr
    set_params_function:
      _target_: CMC_utils.miscellaneous.do_nothing
  accuracy:
    name: accuracy
    init:
      _target_: CMC_utils.metrics.accuracy
      normalize: true
      sample_weight: null
    set_params_function:
      _target_: CMC_utils.miscellaneous.do_nothing
  recall:
    name: recall
    init:
      _target_: CMC_utils.metrics.recall
      pos_label: null
      average: null
      sample_weight: null
      zero_division: 0
    set_params_function:
      _target_: CMC_utils.miscellaneous.do_nothing
  precision:
    name: precision
    init:
      _target_: CMC_utils.metrics.precision
      pos_label: 1
      average: null
      sample_weight: null
      zero_division: 0
    set_params_function:
      _target_: CMC_utils.miscellaneous.do_nothing
  f1_score:
    name: f1_score
    init:
      _target_: CMC_utils.metrics.f1
      pos_label: 1
      average: null
      sample_weight: null
      zero_division: 0
    set_params_function:
      _target_: CMC_utils.miscellaneous.do_nothing
